<rect x="100" y="100" width="120" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="160" y="128" text-anchor="middle" font-size="10" fill="#1a1a2e">Producer</text>
<text x="160" y="146" text-anchor="middle" font-size="8" fill="#888">put() / offer()</text>
<line x1="220" y1="130" x2="260" y2="130" stroke="#999" stroke-width="1.5"/>
<polygon points="255,126 260,130 255,134" fill="#999"/>
<rect x="260" y="100" width="120" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="320" y="128" text-anchor="middle" font-size="10" fill="#4a3000">BlockingQueue</text>
<text x="320" y="146" text-anchor="middle" font-size="8" fill="#888">ArrayBlockingQueue
LinkedBlockingQueue</text>
<line x1="380" y1="130" x2="420" y2="130" stroke="#999" stroke-width="1.5"/>
<polygon points="415,126 420,130 415,134" fill="#999"/>
<rect x="420" y="100" width="120" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="480" y="128" text-anchor="middle" font-size="10" fill="#1b4a1b">Consumer</text>
<text x="480" y="146" text-anchor="middle" font-size="8" fill="#888">take() / poll()</text>
<line x1="540" y1="130" x2="580" y2="130" stroke="#999" stroke-width="1.5"/>
<polygon points="575,126 580,130 575,134" fill="#999"/>
<rect x="580" y="100" width="120" height="60" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="640" y="128" text-anchor="middle" font-size="10" fill="#4a1b1b">阻塞等待</text>
<text x="640" y="146" text-anchor="middle" font-size="8" fill="#888">队列满→put阻塞
队列空→take阻塞</text>
