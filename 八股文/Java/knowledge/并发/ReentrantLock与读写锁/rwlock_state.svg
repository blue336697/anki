<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
<rect width="800" height="350" fill="white"/>
<text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">ReentrantReadWriteLock: AQS state 按位切割</text>
<text x="215" y="58" text-anchor="middle" font-size="11" fill="#888" font-style="italic">写锁 (低16位)</text>
<rect x="35" y="120" width="360" height="50" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="215" y="145" text-anchor="middle" font-size="10" fill="#4a1b1b"><text text-anchor="middle"><tspan x="0" dy="8.0">state &amp; 0x0000FFFF</tspan></text></text>
<rect x="35" y="180" width="360" height="50" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="215" y="205" text-anchor="middle" font-size="10" fill="#4a1b1b"><text text-anchor="middle"><tspan x="0" dy="8.0">写锁重入次数</tspan></text></text>
<rect x="35" y="240" width="360" height="50" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="215" y="265" text-anchor="middle" font-size="10" fill="#4a1b1b"><text text-anchor="middle"><tspan x="0" dy="8.0">独占模式 (exclusive)</tspan></text></text>
<line x1="400" y1="210" x2="412" y2="210" stroke="#999" stroke-width="1.5"/>
<polygon points="408,206 414,210 408,214" fill="#999"/>
<text x="585" y="58" text-anchor="middle" font-size="11" fill="#888" font-style="italic">读锁 (高16位)</text>
<rect x="405" y="100" width="360" height="45" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="585" y="122" text-anchor="middle" font-size="10" fill="#1b4a1b"><text text-anchor="middle"><tspan x="0" dy="8.0">state &gt;&gt;&gt; 16</tspan></text></text>
<rect x="405" y="155" width="360" height="45" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="585" y="177" text-anchor="middle" font-size="10" fill="#1b4a1b"><text text-anchor="middle"><tspan x="0" dy="8.0">所有读线程获取次数总和</tspan></text></text>
<rect x="405" y="210" width="360" height="45" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="585" y="232" text-anchor="middle" font-size="10" fill="#1b4a1b"><text text-anchor="middle"><tspan x="0" dy="8.0">共享模式 (shared)</tspan></text></text>
<rect x="405" y="265" width="360" height="45" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="585" y="287" text-anchor="middle" font-size="10" fill="#1b4a1b"><text text-anchor="middle"><tspan x="0" dy="8.0">每个线程用HoldCounter记录重入</tspan></text></text>
</svg>