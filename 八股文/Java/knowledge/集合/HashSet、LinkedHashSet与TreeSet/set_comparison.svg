<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
<rect width="800" height="280" fill="white"/>
<text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">HashSet / LinkedHashSet / TreeSet 对比</text>
<rect x="23" y="55" width="247" height="28" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="146" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">HashSet</text>
<rect x="23" y="90" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="146" y="105" text-anchor="middle" font-size="9" fill="#333">基于HashMap实现</text>
<rect x="23" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="146" y="135" text-anchor="middle" font-size="9" fill="#333">value存PRESENT常量</text>
<rect x="23" y="150" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="146" y="165" text-anchor="middle" font-size="9" fill="#333">O(1) 增删查</text>
<rect x="23" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="146" y="195" text-anchor="middle" font-size="9" fill="#333">无序</text>
<rect x="23" y="210" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="146" y="225" text-anchor="middle" font-size="9" fill="#333">允许null</text>
<rect x="276" y="55" width="247" height="28" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="399" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b4a1b">LinkedHashSet</text>
<rect x="276" y="90" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="399" y="105" text-anchor="middle" font-size="9" fill="#333">继承HashSet</text>
<rect x="276" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="399" y="135" text-anchor="middle" font-size="9" fill="#333">基于LinkedHashMap</text>
<rect x="276" y="150" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="399" y="165" text-anchor="middle" font-size="9" fill="#333">维护双向链表</text>
<rect x="276" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="399" y="195" text-anchor="middle" font-size="9" fill="#333">保持插入顺序</text>
<rect x="276" y="210" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="399" y="225" text-anchor="middle" font-size="9" fill="#333">略慢于HashSet</text>
<rect x="529" y="55" width="247" height="28" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="652" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a3000">TreeSet</text>
<rect x="529" y="90" width="247" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="652" y="105" text-anchor="middle" font-size="9" fill="#333">基于TreeMap/红黑树</text>
<rect x="529" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="652" y="135" text-anchor="middle" font-size="9" fill="#333">O(log n) 增删查</text>
<rect x="529" y="150" width="247" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="652" y="165" text-anchor="middle" font-size="9" fill="#333">元素自动排序</text>
<rect x="529" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="652" y="195" text-anchor="middle" font-size="9" fill="#333">需要Comparable/Comparator</text>
<rect x="529" y="210" width="247" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="652" y="225" text-anchor="middle" font-size="9" fill="#333">不允许null</text>
</svg>