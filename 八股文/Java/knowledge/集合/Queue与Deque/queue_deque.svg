<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
<rect width="800" height="300" fill="white"/>
<text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Java Queue / Deque 体系</text>
<rect x="23" y="55" width="247" height="28" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="146" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">Queue (单向)</text>
<rect x="23" y="90" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="146" y="105" text-anchor="middle" font-size="9" fill="#333">offer() 入队</text>
<rect x="23" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="146" y="135" text-anchor="middle" font-size="9" fill="#333">poll() 出队</text>
<rect x="23" y="150" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="146" y="165" text-anchor="middle" font-size="9" fill="#333">peek() 查看队头</text>
<rect x="23" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="146" y="195" text-anchor="middle" font-size="9" fill="#333">FIFO</text>
<rect x="23" y="210" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="146" y="225" text-anchor="middle" font-size="9" fill="#333">LinkedList/ArrayDeque</text>
<rect x="276" y="55" width="247" height="28" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="399" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b4a1b">Deque (双向)</text>
<rect x="276" y="90" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="399" y="105" text-anchor="middle" font-size="9" fill="#333">offerFirst/offerLast</text>
<rect x="276" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="399" y="135" text-anchor="middle" font-size="9" fill="#333">pollFirst/pollLast</text>
<rect x="276" y="150" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="399" y="165" text-anchor="middle" font-size="9" fill="#333">可用作Stack或Queue</text>
<rect x="276" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="399" y="195" text-anchor="middle" font-size="9" fill="#333">ArrayDeque → 栈/队列</text>
<rect x="276" y="210" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="399" y="225" text-anchor="middle" font-size="9" fill="#333">LinkedList → List+Deque</text>
<rect x="529" y="55" width="247" height="28" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="652" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a3000">BlockingQueue</text>
<rect x="529" y="90" width="247" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="652" y="105" text-anchor="middle" font-size="9" fill="#333">put()阻塞入队</text>
<rect x="529" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="652" y="135" text-anchor="middle" font-size="9" fill="#333">take()阻塞出队</text>
<rect x="529" y="150" width="247" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="652" y="165" text-anchor="middle" font-size="9" fill="#333">有界队列→背压</text>
<rect x="529" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="652" y="195" text-anchor="middle" font-size="9" fill="#333">ArrayBlockingQueue</text>
<rect x="529" y="210" width="247" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="652" y="225" text-anchor="middle" font-size="9" fill="#333">LinkedBlockingQueue</text>
</svg>