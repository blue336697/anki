<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
<rect width="800" height="340" fill="white"/>
<text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">BIO vs NIO vs AIO 对比</text>
<rect x="23" y="55" width="247" height="28" rx="4" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="146" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a1b1b">BIO (同步阻塞)</text>
<rect x="23" y="90" width="247" height="28" rx="2" fill="#f8cecc" stroke="none"/>
<text x="146" y="105" text-anchor="middle" font-size="9" fill="#333">一个连接一个线程</text>
<rect x="23" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="146" y="135" text-anchor="middle" font-size="9" fill="#333">read/write 阻塞线程</text>
<rect x="23" y="150" width="247" height="28" rx="2" fill="#f8cecc" stroke="none"/>
<text x="146" y="165" text-anchor="middle" font-size="9" fill="#333">模型简单适合低连接</text>
<rect x="23" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="146" y="195" text-anchor="middle" font-size="9" fill="#333">线程资源消耗大</text>
<rect x="23" y="210" width="247" height="28" rx="2" fill="#f8cecc" stroke="none"/>
<text x="146" y="225" text-anchor="middle" font-size="9" fill="#333">ServerSocket 典型实现</text>
<rect x="276" y="55" width="247" height="28" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="399" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">NIO (同步非阻塞)</text>
<rect x="276" y="90" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="399" y="105" text-anchor="middle" font-size="9" fill="#333">Selector 管理多连接</text>
<rect x="276" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="399" y="135" text-anchor="middle" font-size="9" fill="#333">Channel 非阻塞模式</text>
<rect x="276" y="150" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="399" y="165" text-anchor="middle" font-size="9" fill="#333">Buffer 内存缓冲区</text>
<rect x="276" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="399" y="195" text-anchor="middle" font-size="9" fill="#333">Reactor 事件驱动模型</text>
<rect x="276" y="210" width="247" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="399" y="225" text-anchor="middle" font-size="9" fill="#333">Netty 底层基于 NIO</text>
<rect x="529" y="55" width="247" height="28" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="652" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b4a1b">AIO (异步非阻塞)</text>
<rect x="529" y="90" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="652" y="105" text-anchor="middle" font-size="9" fill="#333">系统完成 IO 后回调</text>
<rect x="529" y="120" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="652" y="135" text-anchor="middle" font-size="9" fill="#333">调用线程不等待</text>
<rect x="529" y="150" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="652" y="165" text-anchor="middle" font-size="9" fill="#333">真正异步 IO 模型</text>
<rect x="529" y="180" width="247" height="28" rx="2" fill="white" stroke="none"/>
<text x="652" y="195" text-anchor="middle" font-size="9" fill="#333">Java 实现较少使用</text>
<rect x="529" y="210" width="247" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="652" y="225" text-anchor="middle" font-size="9" fill="#333">Windows IOCP / Linux epoll</text>
</svg>