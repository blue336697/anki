<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
<rect width="800" height="200" fill="white"/>
<text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Java 序列化/反序列化核心概念</text>
<rect x="40" y="80" width="112" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="96" y="108" text-anchor="middle" font-size="10" fill="#1a1a2e">对象 → 字节流
ObjectOutputStream</text>
<text x="96" y="126" text-anchor="middle" font-size="8" fill="#888">transient 字段跳过</text>
<line x1="152" y1="110" x2="192" y2="110" stroke="#999" stroke-width="1.5"/>
<polygon points="187,106 192,110 187,114" fill="#999"/>
<rect x="192" y="80" width="112" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="248" y="108" text-anchor="middle" font-size="10" fill="#4a3000">serialVersionUID
版本校验</text>
<text x="248" y="126" text-anchor="middle" font-size="8" fill="#888">兼容性控制关键</text>
<line x1="304" y1="110" x2="344" y2="110" stroke="#999" stroke-width="1.5"/>
<polygon points="339,106 344,110 339,114" fill="#999"/>
<rect x="344" y="80" width="112" height="60" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="400" y="108" text-anchor="middle" font-size="10" fill="#2d1b4e">字节流 → 对象
ObjectInputStream</text>
<text x="400" y="126" text-anchor="middle" font-size="8" fill="#888">绕过构造器恢复状态</text>
<line x1="456" y1="110" x2="496" y2="110" stroke="#999" stroke-width="1.5"/>
<polygon points="491,106 496,110 491,114" fill="#999"/>
<rect x="496" y="80" width="112" height="60" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="552" y="108" text-anchor="middle" font-size="10" fill="#4a1b1b">readObject
自定义反序列化</text>
<text x="552" y="126" text-anchor="middle" font-size="8" fill="#888">可恢复 transient 值</text>
<line x1="608" y1="110" x2="648" y2="110" stroke="#999" stroke-width="1.5"/>
<polygon points="643,106 648,110 643,114" fill="#999"/>
<rect x="648" y="80" width="112" height="60" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="704" y="108" text-anchor="middle" font-size="10" fill="#4a1b1b">安全边界
类型白名单校验</text>
<text x="704" y="126" text-anchor="middle" font-size="8" fill="#888">防止反序列化漏洞</text>
</svg>