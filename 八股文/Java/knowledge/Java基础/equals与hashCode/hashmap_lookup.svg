<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
<rect width="800" height="200" fill="white"/>
<text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">HashMap 查找流程：hashCode → equals</text>
<rect x="100" y="80" width="120" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="160" y="108" text-anchor="middle" font-size="10" fill="#1a1a2e">key.hashCode()
计算哈希值</text>
<text x="160" y="126" text-anchor="middle" font-size="8" fill="#888">定位桶索引</text>
<line x1="220" y1="110" x2="260" y2="110" stroke="#999" stroke-width="1.5"/>
<polygon points="255,106 260,110 255,114" fill="#999"/>
<rect x="260" y="80" width="120" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="320" y="108" text-anchor="middle" font-size="10" fill="#4a3000">找到桶位
链表/红黑树</text>
<text x="320" y="126" text-anchor="middle" font-size="8" fill="#888">可能多个元素</text>
<line x1="380" y1="110" x2="420" y2="110" stroke="#999" stroke-width="1.5"/>
<polygon points="415,106 420,110 415,114" fill="#999"/>
<rect x="420" y="80" width="120" height="60" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="480" y="108" text-anchor="middle" font-size="10" fill="#2d1b4e">key.equals(node)
逐一比较</text>
<text x="480" y="126" text-anchor="middle" font-size="8" fill="#888">确认是否相等</text>
<line x1="540" y1="110" x2="580" y2="110" stroke="#999" stroke-width="1.5"/>
<polygon points="575,106 580,110 575,114" fill="#999"/>
<rect x="580" y="80" width="120" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="640" y="108" text-anchor="middle" font-size="10" fill="#1b4a1b">返回 value
或 null</text>
<text x="640" y="126" text-anchor="middle" font-size="8" fill="#888">未找到返回null</text>
</svg>