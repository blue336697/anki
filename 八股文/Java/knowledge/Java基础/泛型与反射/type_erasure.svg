<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
<rect width="800" height="220" fill="white"/>
<text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Java 泛型：编译期检查 → 类型擦除</text>
<rect x="40" y="90" width="112" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="96" y="118" text-anchor="middle" font-size="10" fill="#1a1a2e">List&lt;String&gt;
源码泛型声明</text>
<text x="96" y="136" text-anchor="middle" font-size="8" fill="#888">编译期类型安全</text>
<line x1="152" y1="120" x2="192" y2="120" stroke="#999" stroke-width="1.5"/>
<polygon points="187,116 192,120 187,124" fill="#999"/>
<rect x="192" y="90" width="112" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="248" y="118" text-anchor="middle" font-size="10" fill="#4a3000">类型擦除
擦除为 List</text>
<text x="248" y="136" text-anchor="middle" font-size="8" fill="#888">上界 Object 替换类型变量</text>
<line x1="304" y1="120" x2="344" y2="120" stroke="#999" stroke-width="1.5"/>
<polygon points="339,116 344,120 339,124" fill="#999"/>
<rect x="344" y="90" width="112" height="60" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="400" y="118" text-anchor="middle" font-size="10" fill="#2d1b4e">插入 checkcast
类型转换指令</text>
<text x="400" y="136" text-anchor="middle" font-size="8" fill="#888">保证取出时类型正确</text>
<line x1="456" y1="120" x2="496" y2="120" stroke="#999" stroke-width="1.5"/>
<polygon points="491,116 496,120 491,124" fill="#999"/>
<rect x="496" y="90" width="112" height="60" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="552" y="118" text-anchor="middle" font-size="10" fill="#4a1b1b">运行时
只有原始类型</text>
<text x="552" y="136" text-anchor="middle" font-size="8" fill="#888">无法 instanceof 泛型参数</text>
<line x1="608" y1="120" x2="648" y2="120" stroke="#999" stroke-width="1.5"/>
<polygon points="643,116 648,120 643,124" fill="#999"/>
<rect x="648" y="90" width="112" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="704" y="118" text-anchor="middle" font-size="10" fill="#1b4a1b">声明处签名
Signature 属性保留</text>
<text x="704" y="136" text-anchor="middle" font-size="8" fill="#888">反射可读取部分泛型信息</text>
</svg>