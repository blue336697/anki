<text x="202" y="240" text-anchor="middle" font-size="10" fill="#4a3000"><text text-anchor="middle"><tspan x="0" dy="8.0">toString()</tspan></text></text>
<line x1="260" y1="245" x2="272" y2="245" stroke="#999" stroke-width="1.5"/>
<polygon points="268,241 274,245 268,249" fill="#999"/>
<text x="317" y="58" text-anchor="middle" font-size="11" fill="#888" font-style="italic">线程协作</text>
<rect x="265" y="155" width="105" height="50" rx="5" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="317" y="180" text-anchor="middle" font-size="10" fill="#2d1b4e"><text text-anchor="middle"><tspan x="0" dy="8.0">wait()</tspan></text></text>
<rect x="265" y="215" width="105" height="50" rx="5" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="317" y="240" text-anchor="middle" font-size="10" fill="#2d1b4e"><text text-anchor="middle"><tspan x="0" dy="8.0">notify()</tspan></text></text>
<rect x="265" y="275" width="105" height="50" rx="5" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
<text x="317" y="300" text-anchor="middle" font-size="10" fill="#2d1b4e"><text text-anchor="middle"><tspan x="0" dy="8.0">notifyAll()</tspan></text></text>
<line x1="375" y1="245" x2="387" y2="245" stroke="#999" stroke-width="1.5"/>
<polygon points="383,241 389,245 383,249" fill="#999"/>
<text x="432" y="58" text-anchor="middle" font-size="11" fill="#888" font-style="italic">运行时类型</text>
<rect x="380" y="215" width="105" height="50" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="432" y="240" text-anchor="middle" font-size="10" fill="#1b4a1b"><text text-anchor="middle"><tspan x="0" dy="8.0">getClass()</tspan></text></text>
<line x1="490" y1="245" x2="502" y2="245" stroke="#999" stroke-width="1.5"/>
<polygon points="498,241 504,245 498,249" fill="#999"/>
<text x="547" y="58" text-anchor="middle" font-size="11" fill="#888" font-style="italic">对象复制</text>
<rect x="495" y="215" width="105" height="50" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
<text x="547" y="240" text-anchor="middle" font-size="10" fill="#4a1b1b"><text text-anchor="middle"><tspan x="0" dy="8.0">clone() — 浅拷贝，历史包袱重</tspan></text></text>
<line x1="605" y1="245" x2="617" y2="245" stroke="#999" stroke-width="1.5"/>
<polygon points="613,241 619,245 613,249" fill="#999"/>
<text x="662" y="58" text-anchor="middle" font-size="11" fill="#888" font-style="italic">对象终结</text>
<rect x="610" y="215" width="105" height="50" rx="5" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
<text x="662" y="240" text-anchor="middle" font-size="10" fill="#333333"><text text-anchor="middle"><tspan x="0" dy="8.0">finalize() — 已废弃，不可依赖</tspan></text></text>
</svg>