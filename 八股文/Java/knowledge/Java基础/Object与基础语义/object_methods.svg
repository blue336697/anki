<text x="87" y="210" text-anchor="middle" font-size="10" fill="#1a1a2e"><text text-anchor="middle"><tspan x="0" dy="8.0">equals(Object)</tspan></text></text>
<rect x="35" y="245" width="105" height="50" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="87" y="270" text-anchor="middle" font-size="10" fill="#1a1a2e"><text text-anchor="middle"><tspan x="0" dy="8.0">hashCode()</tspan></text></text>
<line x1="145" y1="245" x2="157" y2="245" stroke="#999" stroke-width="1.5"/>
<polygon points="153,241 159,245 153,249" fill="#999"/>
