<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420">
<rect width="750" height="420" fill="white"/>
<text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Object 核心方法分类</text>
<text x="87" y="58" text-anchor="middle" font-size="11" fill="#888" font-style="italic">相等与哈希</text>
