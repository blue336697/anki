<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
<rect width="800" height="340" fill="white"/>
<text x="400" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">B+树索引结构 (InnoDB聚簇索引)</text>

<!-- Root level -->
<rect x="310" y="45" width="180" height="32" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="400" y="66" text-anchor="middle" font-size="10" fill="#1a1a2e">[13 | 25] (根节点)</text>

<!-- Level 1 (internal nodes) -->
<rect x="100" y="105" width="180" height="32" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="190" y="126" text-anchor="middle" font-size="10" fill="#4a3000">[5 | 8 | 12]</text>
<rect x="310" y="105" width="180" height="32" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="400" y="126" text-anchor="middle" font-size="10" fill="#4a3000">[15 | 19 | 24]</text>
<rect x="520" y="105" width="180" height="32" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="610" y="126" text-anchor="middle" font-size="10" fill="#4a3000">[27 | 32 | 45]</text>

<!-- Leaf level -->
<rect x="20" y="165" width="115" height="42" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="77" y="182" text-anchor="middle" font-size="8" fill="#1b4a1b">1,3,4</text>
<text x="77" y="196" text-anchor="middle" font-size="8" fill="#1b4a1b">→[data]</text>
<rect x="145" y="165" width="115" height="42" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="202" y="182" text-anchor="middle" font-size="8" fill="#1b4a1b">6,7,8</text>
<text x="202" y="196" text-anchor="middle" font-size="8" fill="#1b4a1b">→[data]</text>
<rect x="270" y="165" width="115" height="42" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="327" y="182" text-anchor="middle" font-size="8" fill="#1b4a1b">10,11,12</text>
<text x="327" y="196" text-anchor="middle" font-size="8" fill="#1b4a1b">→[data]</text>
<rect x="395" y="165" width="115" height="42" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="452" y="182" text-anchor="middle" font-size="8" fill="#1b4a1b">14,15</text>
<text x="452" y="196" text-anchor="middle" font-size="8" fill="#1b4a1b">→[data]</text>
<rect x="520" y="165" width="115" height="42" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="577" y="182" text-anchor="middle" font-size="8" fill="#1b4a1b">17,19,22</text>
<text x="577" y="196" text-anchor="middle" font-size="8" fill="#1b4a1b">→[data]</text>
<rect x="645" y="165" width="135" height="42" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="712" y="182" text-anchor="middle" font-size="8" fill="#1b4a1b">27,32,45,99</text>
<text x="712" y="196" text-anchor="middle" font-size="8" fill="#1b4a1b">→[data]</text>

<!-- Edges: root → level1 -->
<line x1="370" y1="77" x2="180" y2="105" stroke="#999" stroke-width="1"/>
<line x1="400" y1="77" x2="400" y2="105" stroke="#999" stroke-width="1"/>
<line x1="430" y1="77" x2="610" y2="105" stroke="#999" stroke-width="1"/>

<!-- Edges: level1 → leaves (approximate) -->
<line x1="145" y1="137" x2="77" y2="165" stroke="#999" stroke-width="1"/>
<line x1="180" y1="137" x2="202" y2="165" stroke="#999" stroke-width="1"/>
<line x1="210" y1="137" x2="327" y2="165" stroke="#999" stroke-width="1"/>
<line x1="360" y1="137" x2="452" y2="165" stroke="#999" stroke-width="1"/>
<line x1="440" y1="137" x2="577" y2="165" stroke="#999" stroke-width="1"/>
<line x1="580" y1="137" x2="712" y2="165" stroke="#999" stroke-width="1"/>

<!-- Leaf level linked list -->
<polyline points="135,186 145,186" fill="none" stroke="#82b366" stroke-width="1.5" stroke-dasharray="3,3"/>
<polyline points="260,186 270,186" fill="none" stroke="#82b366" stroke-width="1.5" stroke-dasharray="3,3"/>
<polyline points="385,186 395,186" fill="none" stroke="#82b366" stroke-width="1.5" stroke-dasharray="3,3"/>
<polyline points="510,186 520,186" fill="none" stroke="#82b366" stroke-width="1.5" stroke-dasharray="3,3"/>

<!-- Key features -->
<rect x="20" y="230" width="760" height="95" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
<text x="400" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">B+树关键特性</text>
<text x="30" y="270" font-size="9" fill="#666">• 所有数据存储在叶子节点，非叶子节点只存索引键 | 叶子节点通过双向链表串联，支持范围查询</text>
<text x="30" y="288" font-size="9" fill="#666">• InnoDB聚簇索引：叶子节点存完整行数据 | 二级索引：叶子节点存主键值(需回表)</text>
<text x="30" y="306" font-size="9" fill="#666">• 页大小默认16KB | 扇出率高(一个节点可存几百个键) → 树高度低(通常3-4层) → IO次数少</text>
</svg>
