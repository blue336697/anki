<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300">
<rect width="750" height="300" fill="white"/>
<text x="375" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Redis 持久化：RDB vs AOF</text>
<rect x="23" y="55" width="230" height="28" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="138" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a2e">RDB (快照)</text>
<rect x="23" y="90" width="230" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="138" y="105" text-anchor="middle" font-size="9" fill="#333">触发: save/bgsave</text>
<rect x="23" y="120" width="230" height="28" rx="2" fill="white" stroke="none"/>
<text x="138" y="135" text-anchor="middle" font-size="9" fill="#333">fork子进程写入dump.rdb</text>
<rect x="23" y="150" width="230" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="138" y="165" text-anchor="middle" font-size="9" fill="#333">二进制压缩格式</text>
<rect x="23" y="180" width="230" height="28" rx="2" fill="white" stroke="none"/>
<text x="138" y="195" text-anchor="middle" font-size="9" fill="#333">恢复速度快</text>
<rect x="23" y="210" width="230" height="28" rx="2" fill="#dae8fc" stroke="none"/>
<text x="138" y="225" text-anchor="middle" font-size="9" fill="#333">可能丢失最后几分钟数据</text>
<rect x="259" y="55" width="230" height="28" rx="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="374" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a3000">AOF (追加日志)</text>
<rect x="259" y="90" width="230" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="374" y="105" text-anchor="middle" font-size="9" fill="#333">记录每条写命令</text>
<rect x="259" y="120" width="230" height="28" rx="2" fill="white" stroke="none"/>
<text x="374" y="135" text-anchor="middle" font-size="9" fill="#333">appendfsync策略(always/everysec/no)</text>
<rect x="259" y="150" width="230" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="374" y="165" text-anchor="middle" font-size="9" fill="#333">AOF重写压缩</text>
<rect x="259" y="180" width="230" height="28" rx="2" fill="white" stroke="none"/>
<text x="374" y="195" text-anchor="middle" font-size="9" fill="#333">数据安全性更高</text>
<rect x="259" y="210" width="230" height="28" rx="2" fill="#ffe6cc" stroke="none"/>
<text x="374" y="225" text-anchor="middle" font-size="9" fill="#333">文件通常更大</text>
<rect x="495" y="55" width="230" height="28" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="610" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b4a1b">混合持久化 (Redis 4.0+)</text>
<rect x="495" y="90" width="230" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="610" y="105" text-anchor="middle" font-size="9" fill="#333">RDB快照+AOF增量</text>
<rect x="495" y="120" width="230" height="28" rx="2" fill="white" stroke="none"/>
<text x="610" y="135" text-anchor="middle" font-size="9" fill="#333">aof-use-rdb-preamble</text>
<rect x="495" y="150" width="230" height="28" rx="2" fill="#d5e8d4" stroke="none"/>
<text x="610" y="165" text-anchor="middle" font-size="9" fill="#333">兼顾恢复速度和数据安全</text>
<rect x="495" y="180" width="230" height="28" rx="2" fill="white" stroke="none"/>
<text x="610" y="195" text-anchor="middle" font-size="9" fill="#333">推荐生产环境使用</text>
</svg>