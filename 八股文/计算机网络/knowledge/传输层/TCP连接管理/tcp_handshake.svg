<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260">
<rect width="700" height="260" fill="white"/>
<text x="350" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">TCP 三次握手</text>
<rect x="130" y="110" width="120" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="190" y="138" text-anchor="middle" font-size="10" fill="#1a1a2e">SYN</text>
<text x="190" y="156" text-anchor="middle" font-size="8" fill="#888">Client→Server
SYN=1 seq=x</text>
<line x1="250" y1="140" x2="290" y2="140" stroke="#999" stroke-width="1.5"/>
<polygon points="285,136 290,140 285,144" fill="#999"/>
<rect x="290" y="110" width="120" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
<text x="350" y="138" text-anchor="middle" font-size="10" fill="#4a3000">SYN+ACK</text>
<text x="350" y="156" text-anchor="middle" font-size="8" fill="#888">Server→Client
SYN=1 ACK=1 seq=y ack=x+1</text>
<line x1="410" y1="140" x2="450" y2="140" stroke="#999" stroke-width="1.5"/>
<polygon points="445,136 450,140 445,144" fill="#999"/>
<rect x="450" y="110" width="120" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="510" y="138" text-anchor="middle" font-size="10" fill="#1b4a1b">ACK</text>
<text x="510" y="156" text-anchor="middle" font-size="8" fill="#888">Client→Server
ACK=1 ack=y+1
连接建立</text>
</svg>