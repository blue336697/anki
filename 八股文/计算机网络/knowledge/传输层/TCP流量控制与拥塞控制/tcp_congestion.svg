<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
<rect width="800" height="350" fill="white"/>
<text x="400" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">TCP 拥塞控制：慢启动 → 拥塞避免 → 快重传/快恢复</text>
<!-- Axes -->
<line x1="60" y1="300" x2="760" y2="300" stroke="#999" stroke-width="1.5"/>
<polygon points="760,297 765,300 760,303" fill="#999"/>
<line x1="60" y1="300" x2="60" y2="40" stroke="#999" stroke-width="1.5"/>
<polygon points="57,40 60,35 63,40" fill="#999"/>
<text x="400" y="325" text-anchor="middle" font-size="10" fill="#666">RTT (往返时间)</text>
<text x="18" y="175" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90,18,175)">拥塞窗口 cwnd</text>
<!-- ssthresh line -->
<line x1="60" y1="120" x2="760" y2="120" stroke="#d79b00" stroke-width="1" stroke-dasharray="5,5"/>
<text x="70" y="115" font-size="8" fill="#d79b00">ssthresh</text>
<!-- Phase 1: Slow Start (exponential) -->
<polyline points="60,280 80,265 100,235 120,175 140,120" fill="none" stroke="#6c8ebf" stroke-width="2"/>
<text x="120" y="88" text-anchor="middle" font-size="9" font-weight="bold" fill="#6c8ebf">慢启动</text>
<text x="120" y="100" text-anchor="middle" font-size="7" fill="#666">(指数增长: cwnd×2/RTT)</text>
<!-- Phase 2: Congestion Avoidance (linear) -->
<polyline points="140,120 180,115 220,110 260,105 300,100" fill="none" stroke="#82b366" stroke-width="2"/>
<text x="270" y="78" text-anchor="middle" font-size="9" font-weight="bold" fill="#82b366">拥塞避免</text>
<text x="270" y="90" text-anchor="middle" font-size="7" fill="#666">(线性增长: cwnd+1/RTT)</text>
<!-- Phase 3: Packet loss / timeout -->
<circle cx="300" cy="100" r="5" fill="#b85450"/>
<text x="305" y="95" font-size="8" fill="#b85450">丢包!</text>
<!-- Phase 4: Recovery -->
<polyline points="300,100 320,240 340,230 360,220 380,210 400,200" fill="none" stroke="#b85450" stroke-width="2"/>
<text x="380" y="285" text-anchor="middle" font-size="8" fill="#b85450">超时→ssthresh=cwnd/2, cwnd=1MSS</text>
<!-- Phase 5: Resume -->
<polyline points="400,200 430,170 460,150 490,135 520,125 550,120 580,115 610,110 640,108 670,106 700,104 730,103" fill="none" stroke="#9673a6" stroke-width="2"/>
<text x="660" y="88" text-anchor="middle" font-size="9" font-weight="bold" fill="#9673a6">快恢复</text>
<text x="660" y="100" text-anchor="middle" font-size="7" fill="#666">(ssthresh=cwnd/2, cwnd=ssthresh+3)</text>
<!-- Bottom notes -->
<rect x="80" y="40" width="640" height="25" rx="5" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
<text x="400" y="57" text-anchor="middle" font-size="9" fill="#666">关键算法: 慢启动(AIMD) + 拥塞避免 + 快重传(3个重复ACK) + 快恢复(TCP Reno/NewReno)</text>
</svg>
